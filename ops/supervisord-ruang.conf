; Install in Hermes container's Supervisor include directory.
; Adjust user/path only when runtime differs.
[program:ruang]
directory=/opt/data/ruang
command=/usr/bin/env npm start -- --port 3001
environment=RUANG_HOST="0.0.0.0",NODE_ENV="production",HOME="/opt/data"
user=hermes
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/data/logs/ruang.log
stderr_logfile=/opt/data/logs/ruang-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
